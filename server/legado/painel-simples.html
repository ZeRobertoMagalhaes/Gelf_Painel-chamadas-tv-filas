<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Chamada (versão simples) - GELF</title>
<!-- Versão para TV Box e navegadores antigos: sem módulos, sem recursos modernos. Mesmo conteúdo do painel normal. -->
<style>
html, body { margin: 0; height: 100%; background: #f4f7fc; font-family: Arial, Helvetica, sans-serif; color: #16294a; overflow: hidden; }
#tv { position: absolute; left: 4%; right: 4%; top: 4%; bottom: 4%; }
#topo { height: 12%; background: #16294a; border-radius: 14px; color: #fff; padding: 0 3%; overflow: hidden; }
#topo .t1 { font-size: 3.4vh; font-weight: bold; padding-top: 1.6vh; letter-spacing: 1px; }
#topo .t2 { font-size: 2.2vh; color: #cbd5f5; padding-top: .4vh; }
#conn { position: absolute; right: 1.5%; top: 1.2%; font-size: 1.8vh; padding: .4vh 1.2vh; border-radius: 12px; background: #1f6f3c; color: #d1fae5; }
#conn.off { background: #b91c1c; color: #fee2e2; }
#card { position: absolute; left: 0; right: 0; top: 14.5%; bottom: 25%; background: #fff; border: 4px solid #1e40af; border-radius: 18px; text-align: center; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; overflow: hidden; padding: 0 2%; }
#card.pulso { border-color: #f59e0b; }
.badge { color: #fff; font-weight: bold; font-size: 3.6vh; padding: .7vh 3vw; border-radius: 40px; text-transform: uppercase; letter-spacing: 1px; }
.nome { font-weight: bold; font-size: 10vh; line-height: 1.08; margin: 1.4vh 0 .6vh; max-width: 100%; max-height: 22vh; overflow: hidden; word-wrap: break-word; }
.sala { font-weight: bold; font-size: 8vh; line-height: 1.1; color: #d97706; max-width: 100%; overflow: hidden; }
.status { margin-top: 1.4vh; font-size: 3.2vh; font-weight: bold; padding: .6vh 2.4vw; border-radius: 30px; background: #fef3c7; color: #92400e; }
.status.em_atendimento { background: #dcfce7; color: #166534; }
.status.concluido { background: #e2e8f0; color: #475569; }
.ocioso { font-size: 7vh; font-weight: bold; color: #64748b; }
#hist { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: #e8eef8; border-radius: 14px; padding: 1.2vh 1.4%; overflow: hidden; }
#hist .titulo { text-align: center; font-size: 2vh; font-weight: bold; color: #475569; letter-spacing: 1px; margin-bottom: .8vh; }
#hist .linha { display: -webkit-flex; display: flex; }
.h { -webkit-flex: 1; flex: 1; min-width: 0; background: #fff; border-left: 6px solid #1e40af; border-radius: 10px; padding: 1vh 1vw; margin-right: 1.2vw; overflow: hidden; }
.h:last-child { margin-right: 0; }
.h .hn { font-size: 3vh; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h .ht { font-size: 2vh; color: #64748b; font-weight: bold; margin-top: .3vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#som { position: absolute; left: 50%; bottom: 3%; margin-left: -14vh; width: 28vh; font-size: 3vh; font-weight: bold; color: #fff; background: #d97706; border: 0; border-radius: 40px; padding: 1.4vh 0; z-index: 5; }
#msg { position: absolute; left: 0; right: 0; top: 45%; text-align: center; font-size: 4vh; color: #64748b; }
</style>
</head>
<body>
<div id="tv">
  <div id="topo"><div class="t1">PAINEL DE CHAMADA</div><div class="t2" id="sub">&nbsp;</div></div>
  <div id="conn" class="off">sem conexão</div>
  <div id="card"></div>
  <div id="hist"></div>
  <div id="msg">Conectando ao servidor…</div>
</div>
<button id="som" style="display:none">Ativar som</button>
<script src="/socket.io/socket.io.js"></script>
<script src="/legado/painel-simples.js"></script>
</body>
</html>
